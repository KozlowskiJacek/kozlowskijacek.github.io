name: CI

on:
  push:
  pull_request:

# Nowy push na tę samą gałąź przerywa poprzedni, jeszcze trwający przebieg.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Bez sekretów EmailJS: build ma przejść także bez nich (formularz pokaże wtedy fallback mailto).
      - name: Build
        run: npm run build
