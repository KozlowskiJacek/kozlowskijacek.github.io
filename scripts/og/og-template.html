<!doctype html>
<!--
  Szablon domyślnego obrazu Open Graph (1200×630).
  Edytuj teksty/kolory i wygeneruj PNG: npm run og:render  →  public/og/default.png
  Kolory = paleta z tailwind.config.js.
-->
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 300 700;
        src: url("../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 300 700;
        src: url("../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0f14;
      }
      .card {
        box-sizing: border-box;
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #e8edf2;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(600px 400px at 100% 0%, rgb(116 250 200 / 0.16), transparent 70%),
          radial-gradient(500px 380px at 0% 100%, rgb(255 184 107 / 0.12), transparent 70%), #0b0f14;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 24px;
        border: 1px solid #1f2731;
        border-radius: 28px;
        pointer-events: none;
      }
      .badge {
        align-self: flex-start;
        color: #a9b4c0;
        font-size: 30px;
        font-weight: 500;
      }
      h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 104px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #74fac8;
      }
      p {
        margin: 24px 0 0;
        max-width: 900px;
        color: #a9b4c0;
        font-size: 36px;
        line-height: 1.35;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 28px;
        font-weight: 600;
      }
      .url {
        color: #74fac8;
      }
      .pillars {
        display: flex;
        gap: 16px;
      }
      .pillar {
        padding: 8px 18px;
        border-radius: 12px;
        font-size: 24px;
      }
      .pillar.web {
        color: #74fac8;
        background: rgb(116 250 200 / 0.1);
      }
      .pillar.video {
        color: #ffb86b;
        background: rgb(255 184 107 / 0.1);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Programuję i montuję wideo</div>
      <div>
        <h1>Jacek <span>Kozłowski</span></h1>
        <p>Strony, aplikacje webowe i wideo, które pracują na Twój biznes.</p>
      </div>
      <div class="footer">
        <span class="url">kozlowskijacek.github.io</span>
        <span class="pillars">
          <span class="pillar web">React · Python</span>
          <span class="pillar video">Wideo · Montaż</span>
        </span>
      </div>
    </main>
  </body>
</html>
